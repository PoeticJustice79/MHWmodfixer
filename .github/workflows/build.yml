name: Build

# Runs on a pinned Windows image (not windows-latest) so a future GitHub
# image bump can't silently change what a "reproducible" build actually
# produces -- matters for SignPath Foundation's code-signing program,
# which verifies a signed binary was built from this repo's own source.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller MHWmodfixer.spec --noconfirm

      - name: Package release zip
        shell: pwsh
        run: Compress-Archive -Path dist/MHWmodfixer -DestinationPath MHWmodfixer-dist.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHWmodfixer-dist
          path: MHWmodfixer-dist.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MHWmodfixer-dist.zip
